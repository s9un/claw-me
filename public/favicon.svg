<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090714" />
    </linearGradient>
    <linearGradient id="clawGrad" x1="16" y1="8" x2="48" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="capTop" x1="22" y1="32" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16" fill="url(#bg)" />

  <!-- Cable & Claw Hub -->
  <rect x="30" y="4" width="4" height="10" rx="2" fill="#cbd5e1" />
  <rect x="24" y="13" width="16" height="6" rx="3" fill="#e2e8f0" />

  <!-- Left Prong -->
  <path
    d="M25 18 L14 31 L20 43"
    stroke="url(#clawGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Right Prong -->
  <path
    d="M39 18 L50 31 L44 43"
    stroke="url(#clawGrad)"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Center Prong -->
  <path
    d="M32 19 L32 30"
    stroke="#93c5fd"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Gacha Capsule -->
  <path d="M21 44 A11 11 0 0 1 43 44 Z" fill="url(#capTop)" />
  <path d="M21 44 A11 11 0 0 0 43 44 Z" fill="#f8fafc" />
  <rect x="20.5" y="42.5" width="23" height="3" rx="1.5" fill="#fde047" />
</svg>
